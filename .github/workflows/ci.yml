name: CI 

on:
  push:
  workflow_dispatch:

jobs:
  rss_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          sparse-checkout: rss.xml
      - name: RSS validation
        run: |
          npx feed-validator rss.xml
